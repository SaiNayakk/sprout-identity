# Configuration for the identity service. The file is named identity.yml (not application.yml)
# so several services can share one JVM host without their settings colliding.
spring:
  application:
    name: sprout-identity
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/sprout?currentSchema=identity}
    username: ${IDENTITY_DB_USER:sprout}
    password: ${IDENTITY_DB_PASSWORD:sprout}
    hikari:
      maximum-pool-size: 5
      pool-name: identity
      # Fail fast when the database is unreachable (found by chaos test CHAOS-01): the default
      # 30 s wait held a request thread per call and let the gateway time out first.
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/identity
    schemas: identity
    default-schema: identity
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: false

server:
  port: ${IDENTITY_PORT:8101}
  address: ${IDENTITY_BIND:127.0.0.1}
  tomcat:
    threads:
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_ENABLED:false}   # send traces to a collector only when one runs
  tracing:
    enabled: true   # always carry the trace onward (W3C traceparent), even when nothing collects it
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: sprout-identity

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

sprout:
  identity:
    issuer: sprout-identity
    audience: sprout
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    challenge-ttl: 5m
    max-failed-attempts: 5
    lockout: 15m
    bcrypt-strength: 10
    # Base64 of 32 random bytes. Encrypts TOTP secrets at rest. Required.
    totp-encryption-key: ${IDENTITY_TOTP_KEY:}
    # PEM file with the RSA private key that signs access tokens. Empty: a new key per start (dev only).
    signing-key-path: ${IDENTITY_SIGNING_KEY_PATH:}
    # Demo users for the public sandbox (fictional customers visitors explore as). Off unless the sandbox runs here.
    demo:
      enabled: ${IDENTITY_DEMO_ENABLED:false}
      service-key: ${SPROUT_SERVICE_KEY:dev-only-service-key}
